<style>*{box-sizing:border-box;margin:0;padding:0}html{height:100%}body{min-height:100%;min-height:100dvh}a{color:inherit;text-decoration:none}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.f{animation:up .8s cubic-bezier(.2,.7,.2,1) both}.d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}.d4{animation-delay:.55s}.d5{animation-delay:.7s}

body{font-family:Inter,sans-serif;color:#f4f1ec;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;
background:radial-gradient(700px 420px at 50% 115%,rgba(225,29,42,.38),transparent 65%),radial-gradient(500px 300px at 50% -10%,rgba(217,164,65,.10),transparent 70%),#0a0a0b}
main{max-width:640px}
.logo{width:min(200px,26vh,52vw);aspect-ratio:1;border-radius:50%;display:block;margin:0 auto 20px;box-shadow:0 0 0 6px rgba(255,255,255,.04),0 0 60px rgba(225,29,42,.35)}
.k{font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#d9a441}
h1{font-family:Orbitron,'Arial Black',sans-serif;font-weight:900;text-transform:uppercase;line-height:1.12;letter-spacing:.03em;font-size:clamp(25px,min(7.4vw,6.4vh),62px);margin:14px 0 16px;-webkit-text-stroke:.045em currentColor;paint-order:stroke fill;text-shadow:0 4px 24px rgba(0,0,0,.6)}
h1 span{color:#ff2a36;text-shadow:0 0 30px rgba(225,29,42,.45)}
p{color:#b3afa8;font-size:clamp(15px,2vw,18px);line-height:1.55;max-width:500px;margin:0 auto}
.note{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:7px 14px;border:1px solid rgba(217,164,65,.35);border-radius:99px;font-size:13px;color:#d9a441}
.dot{width:7px;height:7px;border-radius:50%;background:#d9a441;animation:p 1.6s infinite}@keyframes p{50%{opacity:.25}}
.c{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}
.c a{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:6px;background:#e11d2a;color:#fff;font-weight:600;font-size:14px;transition:background .2s}
.c a+a{background:transparent;border:1px solid #3a3a40}.c a:hover{background:#ff3b47}
.c svg{width:16px;height:16px}
.s{margin-top:16px;font-size:13px;color:#8a8780;display:flex;gap:18px;justify-content:center}.s a{border-bottom:1px solid #e11d2a;color:#f4f1ec}
